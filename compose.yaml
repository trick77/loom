services:
  loom:
    image: ghcr.io/trick77/loom:latest
    user: "1000:1000"
    restart: unless-stopped
    # Model choice (BACKEND_*_MODEL) and the LLMWIRE_<PROVIDER>_API_KEY a
    # model's provider reads come from .env as they are, so a model swap never
    # touches this file. .env is their only source: values exported in the
    # shell are not forwarded. Needs Docker Compose 2.24+ (env_file `path`).
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_ADDR: ":8080"
      BACKEND_LOG_LEVEL: "${BACKEND_LOG_LEVEL:-info}"
      BACKEND_DB_PATH: "/data/loom.db"
      BACKEND_USERS_DIR: "/data/users"
      BACKEND_PUBLIC_URL: "${BACKEND_PUBLIC_URL}"
      BACKEND_AUTH_MODE: "${BACKEND_AUTH_MODE:-oidc}"
      BACKEND_TIKA_URL: "http://tika:9998"
      BACKEND_GOTENBERG_URL: "http://gotenberg:3000"
      BACKEND_TAVILY_URL: "${BACKEND_TAVILY_URL:-https://mcp.tavily.com/mcp/}"
      BACKEND_TAVILY_API_KEY: "${BACKEND_TAVILY_API_KEY}"
      BACKEND_OBSCURA_MCP_URL: "http://obscura:8090/mcp"
      # run_python: on once BACKEND_SANDBOX_TOKEN is set (and the sandbox
      # profile is active); otherwise the URL stays empty and the tool off.
      BACKEND_SANDBOX_URL: "${BACKEND_SANDBOX_TOKEN:+http://sandbox:8070}"
      BACKEND_SANDBOX_TOKEN: "${BACKEND_SANDBOX_TOKEN:-}"
      BACKEND_OIDC_ISSUER: "${BACKEND_OIDC_ISSUER}"
      BACKEND_OIDC_CLIENT_ID: "${BACKEND_OIDC_CLIENT_ID}"
      BACKEND_OIDC_CLIENT_SECRET: "${BACKEND_OIDC_CLIENT_SECRET}"
      BACKEND_OIDC_REDIRECT_URL: "${BACKEND_OIDC_REDIRECT_URL}"
      BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL: "${BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL:-}"
      BACKEND_OIDC_ADMIN_GROUP: "${BACKEND_OIDC_ADMIN_GROUP:-loom-admins}"
      # Extra MCP servers from ./conf/mcp.json (standard mcpServers format; merged on top of built-ins).
      BACKEND_MCP_SERVERS_FILE: "${BACKEND_MCP_SERVERS_FILE:-/conf/mcp.json}"
      # Tokens referenced by mcp.json's ${VAR} placeholders (ipverse-lens whois; Context7 docs).
      IPVERSE_API_KEY: "${IPVERSE_API_KEY:-}"
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"
      BACKEND_IMAGE_GEN_BASE_URL: "${BACKEND_IMAGE_GEN_BASE_URL:-https://queue.fal.run}"
      BACKEND_IMAGE_GEN_API_KEY: "${BACKEND_IMAGE_GEN_API_KEY:-}"
      BACKEND_IMAGE_GEN_MODEL: "${BACKEND_IMAGE_GEN_MODEL:-fal-ai/flux-2-pro}"
      BACKEND_IMAGE_GEN_TYPOGRAPHY_MODEL: "${BACKEND_IMAGE_GEN_TYPOGRAPHY_MODEL:-fal-ai/flux-2-max}"
      BACKEND_IMAGE_GEN_POLL_TIMEOUT: "${BACKEND_IMAGE_GEN_POLL_TIMEOUT:-1m}"
      BACKEND_SESSION_SECRET: "${BACKEND_SESSION_SECRET}"
    healthcheck:
      test: ["CMD", "/loom", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    volumes:
      - ./data:/data
      # per-user volumes are mounted manually under /data/users/<user-id>/
      # Read-only conf dir for the optional mcp.json (see BACKEND_MCP_SERVERS_FILE).
      - ./conf:/conf:ro
    networks:
      - traefik
      - loom
      - sandbox
    depends_on:
      tika:
        condition: service_healthy
      gotenberg:
        # HTML→PDF rendering for create_pdf_file
        condition: service_healthy
      obscura:
        # one-shot MCP discovery at startup → wait for Obscura's native MCP server
        condition: service_healthy
    labels:
      # The single loom image serves both the API and the embedded SPA on :8080,
      # so it is the public service; Traefik terminates TLS in front of it.
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.loom.rule: Host(`loom.trick77.com`)
      traefik.http.routers.loom.entrypoints: websecure
      traefik.http.routers.loom.tls: "true"
      traefik.http.services.loom.loadbalancer.server.port: "8080"

  tika:
    # -full bundles Tesseract for OCR (pin a concrete version in real deployments)
    image: apache/tika:3.3.1.0-full
    restart: unless-stopped
    networks:
      - loom
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    labels:
      traefik.enable: "false"

  gotenberg:
    # Chromium-based HTML→PDF renderer for create_pdf_file (Noto Color Emoji bundled)
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - loom
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    labels:
      traefik.enable: "false"

  obscura:
    # Headless-browser MCP. Obscura v0.1.8+ can bind native MCP HTTP to
    # 0.0.0.0, so no local wrapper or stdio bridge is needed.
    # Loom reaches it via BACKEND_OBSCURA_MCP_URL; tools are
    # surfaced to the LLM as obscura__<tool>.
    image: h4ckf0r0day/obscura:0.2.2
    restart: unless-stopped
    command:
      - mcp
      - --http
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      # The upstream image is built without the `stealth` cargo feature, so this
      # gives tracker blocking and a consistent fingerprint, not TLS
      # impersonation. The CLI accepts the flag either way.
      - --stealth
      # Do not add --allow-private-network: Obscura's default private/loopback
      # denylist is part of Loom's SSRF protection for browser tools.
    healthcheck:
      # The upstream image is distroless, so there is no shell/curl/node for a
      # real TCP probe. Startup MCP discovery retries within its 30s deadline to
      # cover any short gap between process start and the HTTP listener binding.
      test: ["CMD", "/obscura", "mcp", "--help"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 6
    networks:
      - loom
    labels:
      traefik.enable: "false"

  sandbox:
    # Runs run_python jobs. Opt-in: needs gVisor registered as the runsc
    # runtime on the Docker host (see docs/sandbox.md). Enable with
    # COMPOSE_PROFILES=sandbox and BACKEND_SANDBOX_TOKEN in .env. loom does
    # not depend on it: it offers the tool while the sidecar answers.
    image: ghcr.io/trick77/loom-sandbox:latest
    profiles: ["sandbox"]
    # gVisor is the boundary to the host kernel; the runner refuses to start
    # without it.
    runtime: runsc
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /work:size=16m,mode=0711
    # Two job slots of 1.25 GiB address space plus their 320 MiB tmpfs each.
    mem_limit: 4g
    cpus: 2
    pids_limit: 1024
    cap_drop: [ALL]
    # Capabilities inside gVisor's kernel only: namespaces and mounts per job
    # (SYS_ADMIN), the drop to a slot uid (SETUID, SETGID), killing and
    # cleaning up that uid's job (KILL, CHOWN, DAC_OVERRIDE, FOWNER).
    cap_add: [SYS_ADMIN, SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_TOKEN: "${BACKEND_SANDBOX_TOKEN:-}"
    healthcheck:
      test: ["CMD", "/loom-sandbox", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    # Only on the internal sandbox network: no egress, reachable from loom
    # alone. Each job also runs in its own empty network namespace.
    networks:
      - sandbox
    labels:
      traefik.enable: "false"

networks:
  loom:
  # internal: no route out of the network, so nothing in the sandbox reaches
  # the internet even if a job escaped its network namespace.
  sandbox:
    internal: true
  traefik:
    external: true
