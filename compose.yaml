services:
  loom:
    image: ghcr.io/trick77/loom:latest
    # distroless nonroot's own uid, never 1000 (the host's first user). Host
    # ./data (and per-user dirs below it) must belong to it:
    # sudo chown -R 65532:65532 data
    user: "65532:65532"
    restart: unless-stopped
    # Model choice (BACKEND_*_MODEL) and the LLMWIRE_<PROVIDER>_API_KEY a
    # model's provider reads come from .env as they are, so a model swap never
    # touches this file. .env is their only source: values exported in the
    # shell are not forwarded. Needs Docker Compose 2.24+ (env_file `path`).
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_ADDR: ":8080"
      BACKEND_LOG_LEVEL: "${BACKEND_LOG_LEVEL:-info}"
      BACKEND_DB_PATH: "/data/loom.db"
      BACKEND_USERS_DIR: "/data/users"
      PUBLIC_FQDN: "${PUBLIC_FQDN:-}"
      BACKEND_AUTH_MODE: "${BACKEND_AUTH_MODE:-oidc}"
      BACKEND_TIKA_URL: "http://tika:9998"
      # Document tools sidecar (docs/docgen.md), always on. BACKEND_DOCGEN_TOKEN
      # comes in through env_file.
      BACKEND_DOCGEN_URL: "${BACKEND_DOCGEN_URL:-http://docgen:8020}"
      # Web search sidecar (docs/search.md), always on. BACKEND_SEARCH_TOKEN
      # comes in through env_file.
      BACKEND_SEARCH_URL: "${BACKEND_SEARCH_URL:-http://search:8030}"
      # The Tavily key is the sidecar's alone: over what env_file loads, loom
      # sees only whether one is set (it warns when the sidecar is not configured).
      BACKEND_TAVILY_API_KEY: "${BACKEND_TAVILY_API_KEY:+set}"
      # BACKEND_OBSCURA_MCP_TOKEN comes in through env_file, like the other secrets.
      BACKEND_OBSCURA_MCP_URL: "http://obscura:8090/mcp"
      # run_python sidecar; the tool is offered while it answers. The token is
      # optional (set the same BACKEND_SANDBOX_TOKEN for both services).
      BACKEND_SANDBOX_URL: "http://sandbox:8070"
      BACKEND_SANDBOX_TOKEN: "${BACKEND_SANDBOX_TOKEN:-}"
      # Apple Music sidecar (docs/tunewire.md), opt-in: COMPOSE_PROFILES=tunewire
      # plus BACKEND_TUNEWIRE_URL=http://tunewire:8060 and _USERS in .env.
      # BACKEND_TUNEWIRE_TOKEN comes in through env_file.
      BACKEND_TUNEWIRE_URL: "${BACKEND_TUNEWIRE_URL:-}"
      BACKEND_TUNEWIRE_USERS: "${BACKEND_TUNEWIRE_USERS:-}"
      # Strava sidecar (docs/strava.md), opt-in: COMPOSE_PROFILES=strava plus
      # BACKEND_STRAVA_URL=http://strava:8050 and _USERS in .env.
      # BACKEND_STRAVA_TOKEN comes in through env_file.
      BACKEND_STRAVA_URL: "${BACKEND_STRAVA_URL:-}"
      BACKEND_STRAVA_USERS: "${BACKEND_STRAVA_USERS:-}"
      BACKEND_OIDC_ISSUER: "${BACKEND_OIDC_ISSUER}"
      BACKEND_OIDC_CLIENT_ID: "${BACKEND_OIDC_CLIENT_ID}"
      BACKEND_OIDC_CLIENT_SECRET: "${BACKEND_OIDC_CLIENT_SECRET}"
      BACKEND_OIDC_REDIRECT_URL: "${BACKEND_OIDC_REDIRECT_URL}"
      BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL: "${BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL:-}"
      BACKEND_OIDC_ADMIN_GROUP: "${BACKEND_OIDC_ADMIN_GROUP:-loom-admins}"
      # Extra MCP servers from ./conf/mcp.json (standard mcpServers format; merged on top of built-ins).
      BACKEND_MCP_SERVERS_FILE: "${BACKEND_MCP_SERVERS_FILE:-/conf/mcp.json}"
      # Tokens referenced by mcp.json's ${VAR} placeholders (ipverse-lens whois; Context7 docs).
      IPVERSE_API_KEY: "${IPVERSE_API_KEY:-}"
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"
      # peeq video library (mcp.json "peeq" entry; see conf/mcp.json.example).
      PEEQ_MCP_URL: "${PEEQ_MCP_URL:-}"
      PEEQ_MCP_TOKEN: "${PEEQ_MCP_TOKEN:-}"
      BACKEND_PEEQ_USERS: "${BACKEND_PEEQ_USERS:-}"
      # Image sidecar (docs/imagegen.md), opt-in: COMPOSE_PROFILES=imagegen plus
      # BACKEND_IMAGE_GEN_URL=http://imagegen:8040 in .env.
      # BACKEND_IMAGE_GEN_TOKEN comes in through env_file.
      BACKEND_IMAGE_GEN_URL: "${BACKEND_IMAGE_GEN_URL:-}"
      # The fal key is the sidecar's alone: over what env_file loads, loom sees
      # only whether one is set (it warns when the sidecar is not configured).
      BACKEND_IMAGE_GEN_API_KEY: "${BACKEND_IMAGE_GEN_API_KEY:+set}"
      BACKEND_SESSION_SECRET: "${BACKEND_SESSION_SECRET}"
    healthcheck:
      test: ["CMD", "/loom", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    volumes:
      - ./data:/data
      # per-user volumes are mounted manually under /data/users/<user-id>/
      # Read-only conf dir for the optional mcp.json (see BACKEND_MCP_SERVERS_FILE).
      - ./conf:/conf:ro
    networks:
      - traefik
      - loom
      - sandbox
    depends_on:
      tika:
        condition: service_healthy
      docgen:
        # Discovered at boot: waiting keeps the document tools from missing
        # until the next refresh.
        condition: service_healthy
      obscura:
        # one-shot MCP discovery at startup → wait for Obscura's native MCP server
        condition: service_healthy
      search:
        # Discovered at boot: waiting keeps web search from missing until the
        # next refresh.
        condition: service_healthy
      imagegen:
        # Discovered at boot like the rest: waiting keeps the image tool from
        # missing until the next refresh. Opt-in profile, so not required.
        condition: service_healthy
        required: false
    labels:
      # The single loom image serves both the API and the embedded SPA on :8080,
      # so it is the public service; Traefik terminates TLS in front of it.
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.loom.rule: Host(`${PUBLIC_FQDN:?set PUBLIC_FQDN in .env, the hostname Traefik routes loom on}`)
      traefik.http.routers.loom.entrypoints: websecure
      traefik.http.routers.loom.tls: "true"
      traefik.http.services.loom.loadbalancer.server.port: "8080"

  tika:
    # -full bundles Tesseract for OCR (pin a concrete version in real deployments)
    image: apache/tika:4.2.0-1-full
    restart: unless-stopped
    networks:
      - loom
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    labels:
      traefik.enable: "false"

  gotenberg:
    # Chromium-based HTML→PDF renderer for the docgen sidecar's PDFs (Noto Color Emoji bundled)
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - loom
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    labels:
      traefik.enable: "false"

  obscura:
    # Headless-browser MCP. Obscura v0.1.8+ can bind native MCP HTTP to
    # 0.0.0.0, so no local wrapper or stdio bridge is needed.
    # Loom reaches it via BACKEND_OBSCURA_MCP_URL; tools are
    # surfaced to the LLM as obscura__<tool>.
    image: h4ckf0r0day/obscura:0.2.5
    restart: unless-stopped
    environment:
      # v0.2.3+ refuses MCP beyond loopback without a token of at least 32
      # characters: the one loom reads from .env.
      OBSCURA_MCP_TOKEN: "${BACKEND_OBSCURA_MCP_TOKEN:?set BACKEND_OBSCURA_MCP_TOKEN in .env (openssl rand -hex 32)}"
    command:
      - mcp
      - --http
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      # The upstream image is built without the `stealth` cargo feature, so this
      # gives tracker blocking and a consistent fingerprint, not TLS
      # impersonation. The CLI accepts the flag either way.
      - --stealth
      # Do not add --allow-private-network: Obscura's default private/loopback
      # denylist is part of Loom's SSRF protection for browser tools.
    healthcheck:
      # The upstream image is distroless, so there is no shell/curl/node for a
      # real TCP probe. Startup MCP discovery retries within its 30s deadline to
      # cover any short gap between process start and the HTTP listener binding.
      test: ["CMD", "/obscura", "mcp", "--help"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 6
    networks:
      - loom
    labels:
      traefik.enable: "false"

  sandbox:
    # Runs run_python jobs (docs/sandbox.md): a plain container, nothing on the
    # host. Each job runs as its own uid, in its own directory, as one process
    # with no network sockets (seccomp). loom does not depend on it: it
    # offers the tool while the sidecar answers.
    image: ghcr.io/trick77/loom-sandbox:latest
    restart: unless-stopped
    read_only: true
    # Job directories: one tmpfs per slot, so the kernel enforces each slot's
    # 320 MiB share. The runner checks they are separate mounts and counts
    # their sizes in its memory budget.
    tmpfs:
      - /work/slot0:size=320m,mode=0711
      - /work/slot1:size=320m,mode=0711
    shm_size: 64m
    # Hard ceiling for everything in the sandbox. Each job is one process
    # (1.25 GiB address space) with its slot's 320 MiB tmpfs; two slots plus
    # /dev/shm fit the runner's 3.5 GiB budget, the rest is the server.
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    # The drop to a slot uid (SETUID, SETGID) and killing and cleaning up that
    # uid's job (KILL, CHOWN, DAC_OVERRIDE, FOWNER). Nothing else.
    cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_TOKEN: "${BACKEND_SANDBOX_TOKEN:-}"
    healthcheck:
      test: ["CMD", "/loom-sandbox", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    # Only on the internal sandbox network: no egress, reachable from loom
    # alone. Jobs cannot open network sockets at all.
    networks:
      - sandbox
    labels:
      traefik.enable: "false"

  tunewire:
    # Apple Music for loom (docs/tunewire.md): each user's own playlists and
    # catalog search over MCP. Holds every connected user's media-user-token in
    # its volume, so every route needs TUNEWIRE_TOKEN. Opt-in via the profile;
    # loom does not depend on it: a dead sidecar only costs its tools.
    image: ghcr.io/trick77/loom-tunewire:latest
    profiles: ["tunewire"]
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      TUNEWIRE_TOKEN: "${BACKEND_TUNEWIRE_TOKEN:-}"
      TUNEWIRE_STOREFRONT: "${TUNEWIRE_STOREFRONT:-ch}"
    # Host dir for backups, outside ./data (loom must never read these tokens);
    # owned by 65532 or the sidecar refuses to start: docs/tunewire.md, Setup.
    volumes:
      - ./tunewire-data:/data
    healthcheck:
      test: ["CMD", "/loom-tunewire", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    # The loom network: reachable from loom only, with egress to Apple.
    networks:
      - loom
    labels:
      traefik.enable: "false"

  strava:
    # Strava for loom (docs/strava.md): each user's own activities over MCP.
    # Holds every connected user's Strava tokens, stored activities and
    # computed metrics in its volume, plus the Strava app's client secret, so every route needs
    # STRAVA_TOKEN. Opt-in via the profile; a dead sidecar only costs its tools.
    image: ghcr.io/trick77/loom-strava:latest
    profiles: ["strava"]
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      STRAVA_TOKEN: "${BACKEND_STRAVA_TOKEN:-}"
      STRAVA_CLIENT_ID: "${STRAVA_CLIENT_ID:-}"
      STRAVA_CLIENT_SECRET: "${STRAVA_CLIENT_SECRET:-}"
    # Host dir for backups, outside ./data (loom must never read these tokens);
    # owned by 65532 or the sidecar refuses to start: docs/strava.md, Setup.
    volumes:
      - ./strava-data:/data
    healthcheck:
      test: ["CMD", "/loom-strava", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    # The loom network: reachable from loom only, with egress to Strava.
    networks:
      - loom
    labels:
      traefik.enable: "false"

  search:
    # loom's web search over MCP (docs/search.md): Tavily answers. Holds the
    # Tavily key, so every route needs SEARCH_TOKEN. Stateless: no volume.
    # Without a key it serves no tool and web search is off.
    image: ghcr.io/trick77/loom-search:latest
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SEARCH_TOKEN: "${BACKEND_SEARCH_TOKEN:-}"
      SEARCH_TAVILY_API_KEY: "${BACKEND_TAVILY_API_KEY:-}"
    healthcheck:
      test: ["CMD", "/loom-search", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    # The loom network: reachable from loom only, with egress to Tavily.
    networks:
      - loom
    labels:
      traefik.enable: "false"

  docgen:
    # loom's document tools over MCP (docs/docgen.md): text, PDF, XLSX, DOCX,
    # PPTX files; Gotenberg renders the PDFs. Every route needs DOCGEN_TOKEN.
    # Stateless: no volume.
    image: ghcr.io/trick77/loom-docgen:latest
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DOCGEN_TOKEN: "${BACKEND_DOCGEN_TOKEN:-}"
      DOCGEN_GOTENBERG_URL: "http://gotenberg:3000"
    depends_on:
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/loom-docgen", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    # The loom network: reachable from loom only, beside Gotenberg.
    networks:
      - loom
    labels:
      traefik.enable: "false"

  imagegen:
    # loom's image tool over MCP (docs/imagegen.md): fal renders. Holds the fal
    # key, so every route needs IMAGEGEN_TOKEN. Stateless: no volume. Opt-in via
    # the profile; a dead sidecar only costs the image tool.
    image: ghcr.io/trick77/loom-imagegen:latest
    profiles: ["imagegen"]
    restart: unless-stopped
    # A render in flight finishes on SIGTERM (it is paid for either way).
    stop_grace_period: 3m
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      IMAGEGEN_TOKEN: "${BACKEND_IMAGE_GEN_TOKEN:-}"
      IMAGEGEN_API_KEY: "${BACKEND_IMAGE_GEN_API_KEY:-}"
      # Empty takes the sidecar's default.
      IMAGEGEN_MODEL: "${BACKEND_IMAGE_GEN_MODEL:-}"
      IMAGEGEN_TYPOGRAPHY_MODEL: "${BACKEND_IMAGE_GEN_TYPOGRAPHY_MODEL:-}"
      IMAGEGEN_BASE_URL: "${BACKEND_IMAGE_GEN_BASE_URL:-}"
      IMAGEGEN_POLL_TIMEOUT: "${BACKEND_IMAGE_GEN_POLL_TIMEOUT:-}"
    healthcheck:
      test: ["CMD", "/loom-imagegen", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    # The loom network: reachable from loom only, with egress to fal.
    networks:
      - loom
    labels:
      traefik.enable: "false"

networks:
  loom:
  # internal: no route out of the network, so not even the sandbox's runner
  # reaches the internet.
  sandbox:
    internal: true
  traefik:
    external: true
