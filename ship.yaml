go:
  dir: backend
ui:
  embed: backend/web/dist
steps:
  # Model facts live in llmwire profiles; loom names a model only in
  # configuration (AGENTS.md).
  - { name: model names, run: scripts/check-model-names.sh }
images:
  - { containerfile: backend/Containerfile }
  # run_python's sidecar ships with every release under the same version, so
  # compose's pair always matches.
  - { suffix: "-sandbox", containerfile: sandbox/Containerfile }
visibility: public
allow:
  - { rule: containerfile, image: "-sandbox", why: "loom-sandbox starts as root to drop each job to its own slot uid (cap_add SETUID/SETGID in compose)" }
  - { rule: distroless, image: "-sandbox", why: "jobs run CPython and its wheels, which need a userland" }
  - { rule: handrolled, path: backend/cmd/loom-sandbox/server.go, why: "the backend probes /healthz across the docker network; kit's Health answers loopback only" }
dependabot:
  ignore:
    - ecosystem: gomod
      dependency: github.com/ncruces/go-sqlite3
      why: "sqlite-vec-go-bindings v0.1.7-alpha.2 is welded to v0.23.3 (v0.24+ breaks the binding); bump both or neither, by hand"
    - ecosystem: gomod
      dependency: github.com/asg017/sqlite-vec-go-bindings
      why: "wasm built against ncruces' SQLite: a lone bump skews the pair and breaks vector search at runtime; bump both or neither, by hand"
    - ecosystem: npm
      dependency: katex
      versions: [">=0.17.0"]
      why: "only its stylesheet is imported, over the markup rehype-katex's katex (^0.16) builds; 0.18 renamed the structural classes and collapses every fraction"
