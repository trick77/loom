name: Tests

on:
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover needs history to diff against the base ref
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install diff-cover==10.3.0
      - run: cd backend && go vet ./...
      - run: make backend-coverage
      - name: Fetch base ref
        # Guarantee refs/remotes/origin/<base> exists; a pull_request build
        # checks out the merge ref, not the base branch.
        run: git fetch --no-tags origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - name: Coverage gate
        run: ./hack/coverage-gate.sh origin/${{ github.base_ref }}

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover needs history to diff against the base ref
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install diff-cover==10.3.0
      - run: cd ui && npm ci
      - run: cd ui && npm run build # tsc --noEmit && vite build — fängt Typ-/Build-Fehler
      - run: make fe-coverage # also enforces the project line floor via vitest thresholds
      - name: Fetch base ref
        # Guarantee refs/remotes/origin/<base> exists; a pull_request build
        # checks out the merge ref, not the base branch.
        run: git fetch --no-tags origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - name: Coverage gate
        run: ./hack/coverage-gate.sh origin/${{ github.base_ref }}
