<!--
  Source for apple-touch-icon.png only. Not shipped: ui/icons/ is outside Vite's
  publicDir, so nothing here is copied into the bundle.

  Two things iOS forces that a bare mark cannot give it:

  1. An opaque ground. iOS composites an apple-touch-icon onto PURE BLACK before
     masking it, and iPadOS flattens it onto WHITE behind a tab — which is where
     the white plate fixed in #510 came from. #1f1e1b is loom's own ground, the
     value ui/index.html's theme-color carries.
  2. Square corners. iOS applies its own superellipse mask; rounding the corners
     here would double-round them.

  The glyph is smaller than in ui/public/icon.svg (60% vs 96%) because it now
  sits inside a tile with its own edges to breathe against, rather than being
  the whole picture.

  Same path, same 1.5 stroke and the same true-bbox centring — see
  ui/public/icon.svg for all of it, and for why the nominal 24x24 box is not
  used. The stroke is in glyph units, so shrinking the glyph thins it with it
  and the weight stays proportional.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#1f1e1b" />
  <g
    transform="translate(10.5830 10.5830) scale(1.7847)"
    fill="none"
    stroke="#c15f3c"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path
      d="M11.9532 2.00004C17.5019 2.00004 22 6.47719 22 12C22 17.5229 17.5019 22 11.9532 22C-0.631103 22 -1.82658 4.01759 11.4985 5.00004C14.8499 5.24714 18.0289 8.41019 18.0289 12C18.0289 16.5 15.2348 18.5 11.4985 18.5C4.5 18.5 3.19042 8.46695 11.0021 9.00004C12.508 9.1028 14.0162 10.3432 14.0162 12C14.0162 13.9279 13 15 11.1211 15"
    />
  </g>
</svg>
