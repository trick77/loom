<!--
  Loom's icon: the spiral mark, the same single path ui/src/assets/loom-logo.svg
  and ui/src/LoomMark.tsx draw. Copied rather than imported — nothing loads a
  React component to produce a static asset. Stroke is 1.5 in glyph units, so it
  scales with the glyph and stays proportional across all three sources here.

  Sized off the mark's TRUE bbox, not the nominal 24x24 viewBox the path only
  partly fills. Measured by rendering at 1024 and trimming: the ink is a square
  21.516 units on a side at offset 1.2422 — centred, so no optical nudge is
  needed. Scaling by the nominal box instead is what makes a glyph read as a dot
  at favicon sizes. The transform below puts that bbox at 96% of the 64-unit
  tile, near enough edge to edge: a tab already sets the icon in padding of its
  own, so a margin inside the tile only shrinks the mark for nothing.

  ui/icons/icon-maskable.svg insets its glyph to 46% instead, because Android
  crops an adaptive icon and its tile really is visible. Nothing else needs a
  separate source: this file drives the tab icon, both PWA rasters and the iOS
  touch icon.

  THIS FILE IS TRANSPARENT, and it stays that way. It briefly carried an opaque
  #1f1e1b canvas, on the reasoning that anything outside the mark is otherwise
  the client's to paint and Safari's light tab bar would show white in the
  corners. That is true, and it is not worth what it costs: a hard dark square
  in every context that draws the icon large — Safari's Start Page tile most
  visibly — and, on iPad, a mark that plainly looks better without it.

  So the client composites, and on Safari desktop it composites onto white.
  Accepted deliberately for THIS file. Do not "fix" it by putting the rect back;
  that trade has been made and reverted once already, and the reasons were about
  the rasters drawn large — Safari's Start Page tile, and iPad.

  THE TAB ICON NO LONGER COMES FROM THIS FILE. It moved to icon-favicon.svg
  beside this one, which is this file on a rounded tile with the spiral inset.
  The reason is a surface this note never measured: Safari draws favicons on a
  light rgb(192,192,192) plate in its favourites and bookmarks bars, where a
  transparent mark is an orange scribble on a white card. Nothing above changes
  for what this file still renders — icon-192, icon-512 and apple-touch-icon.png
  — which is why it is kept rather than rewritten.

  The glyph runs to 96% of the tile in every raster this file produces,
  including apple-touch-icon.png. There is no inset version: an inset only earns
  its keep when a tile is visible behind the mark, and with no ground there is
  no tile. iOS's superellipse mask is not a reason either — the spiral is round,
  so the corners the mask cuts hold no ink.

  Every SVG and PNG icon loom ships is transparent — including the maskable one,
  which trades a launcher-supplied colour for the same reason. ui/scripts/
  gen-icons.sh asserts that on all four rasters. Regenerate them with that
  script after touching this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g
    transform="translate(-2.2668 -2.2668) scale(2.8556)"
    fill="none"
    stroke="#c15f3c"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path
      d="M11.9532 2.00004C17.5019 2.00004 22 6.47719 22 12C22 17.5229 17.5019 22 11.9532 22C-0.631103 22 -1.82658 4.01759 11.4985 5.00004C14.8499 5.24714 18.0289 8.41019 18.0289 12C18.0289 16.5 15.2348 18.5 11.4985 18.5C4.5 18.5 3.19042 8.46695 11.0021 9.00004C12.508 9.1028 14.0162 10.3432 14.0162 12C14.0162 13.9279 13 15 11.1211 15"
    />
  </g>
</svg>
